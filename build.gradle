plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def releaseVersion = providers.gradleProperty("release_version").orElse(project.version.toString())

base {
    archivesName = project.archives_base_name
}

tasks.withType(Jar).configureEach {
    archiveVersion.set(releaseVersion)
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "companion" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "modmenu_version", project.modmenu_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "modmenu_version": project.modmenu_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def changelogFile = layout.buildDirectory.file("changelog.txt")

tasks.register("generateChangelog") {
    group = "publishing"
    description = "Builds the changelog from git commit messages between lastTag and currentTag"

    inputs.property("lastTag", project.providers.gradleProperty("lastTag").orElse(""))
    inputs.property("currentTag", project.providers.gradleProperty("currentTag").orElse(""))
    inputs.property("maxCommits", project.providers.gradleProperty("changelog_max_commit_search").orElse("100"))
    outputs.file(changelogFile)
    outputs.upToDateWhen { false }

    doLast {
        def lastTag = project.providers.gradleProperty("lastTag").getOrNull()
        def currentTag = project.providers.gradleProperty("currentTag").getOrNull()
        def maxCommits = project.providers.gradleProperty("changelog_max_commit_search").getOrElse("100")
        def changelog = "No Changelog Available"

        if (!lastTag || !currentTag) {
            println "Missing lastTag or currentTag parameters, generating fallback changelog"
        } else {
            println "Last version: $lastTag"
            println "Current version: $currentTag"

            def tagCheck = project.providers.exec {
                commandLine("git", "rev-parse", "--verify", "--quiet", "refs/tags/$currentTag")
                ignoreExitValue = true
            }
            def target = tagCheck.result.get().exitValue == 0 ? currentTag : "HEAD"

            def commits = project.providers.exec {
                commandLine("git", "log", "--max-count=$maxCommits", "--pretty=format:%b", "$lastTag..$target")
                ignoreExitValue = true
            }
            def result = commits.result.get()
            def output = commits.standardOutput.asText.get()

            if (result.exitValue != 0) {
                println "git log failed (exit ${result.exitValue}):"
                println commits.standardError.asText.get()
            } else {
                def changes = StringBuilder.newInstance()
                output.eachLine { line ->
                    def processedLine = line.toString()
                    if (processedLine.startsWith('"')) {
                        processedLine = processedLine.substring(1)
                    }
                    if (processedLine.endsWith('"')) {
                        processedLine = processedLine.substring(0, processedLine.length() - 1)
                    }
                    if (processedLine.startsWith("- ")) {
                        if (changes.length() == 0) {
                            changes << processedLine
                        } else {
                            changes << "\n$processedLine"
                        }
                    }
                }
                if (changes.length() > 0) {
                    changelog = changes.toString()
                }
            }
        }

        println "Changelog:"
        println changelog
        changelogFile.get().asFile.text = changelog
    }
}

publishMods {
    version = releaseVersion
    file = jar.archiveFile
    changelog = providers.environmentVariable("CHANGELOG").orElse(providers.fileContents(changelogFile).asText)
    type = STABLE
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "WUZ1RDId"
        minecraftVersions.add(project.minecraft_version)
        environment = CLIENT_ONLY

        requires("fabric-api")
        requires("modmenu")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1804384"
        minecraftVersions.add(project.minecraft_version)
        client = true
        javaVersions.add(JavaVersion.toVersion(targetJavaVersion))
        changelogType = "markdown"

        requires("fabric-api")
        requires("modmenu")
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "NotNightSky/Companion"
        commitish = "26.2-FQ"
        tagName = releaseVersion
    }
}

["publishMods", "publishGithub", "publishModrinth", "publishCurseforge"].each { name ->
    tasks.named(name) {
        dependsOn("generateChangelog")
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
