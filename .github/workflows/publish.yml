name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no v prefix, e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_VERSION: ${{ inputs.version }}+${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Check tag is unpublished
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag $RELEASE_VERSION already exists"
            exit 1
          fi

      - name: Find previous tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version="$VERSION" -Prelease_version="$RELEASE_VERSION"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          ./gradlew publishMods \
            -Pmod_version="$VERSION" \
            -Prelease_version="$RELEASE_VERSION" \
            -PlastTag="$PREVIOUS_TAG" \
            -PcurrentTag="$RELEASE_VERSION"
